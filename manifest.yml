# TAS 배포 manifest — web / mcp / worker 세 앱.
# worker(broadcom-sr-worker)는 상시 떠서 일정 간격으로 collector/collect.ts 를 자식
# 프로세스로 돌린다(TAS 엔 Scheduler 타일이 없어 크론을 못 걸기 때문). no-route 라 라우트가
# 없고, health-check 는 process(프로세스 생존만 확인). SR_COLLECT_INTERVAL_MS(기본 15분)·
# SR_COLLECT_HOURS(운영 시간대, 예 "8-20") 로 조절한다.
#
# 데이터: 세 앱이 같은 Postgres 를 바인딩한다. DATABASE_URL(단일 자격, .env) 우선,
#   없으면 VCAP_SERVICES(lib/dbConn.ts). SR_PG_SCHEMA 전용 스키마에 첫 起動 스키마 자동 생성.
#
# 세션/기기신뢰는 DB(team_session_state)로 백업된다 — 재시작에도 로그인 세션 유지.
#   TAS 컨테이너엔 브라우저가 없어 최초 로그인은 로컬/VM 에서 하고 scripts/seed-session.ts
#   (npm run seed:session)로 DB 에 심는다. 그러면 worker 가 hydrate 로 그 세션을 쓴다.
#
# ⚠ 시크릿(SR_SECRET_KEY/SR_USERNAME/SR_PASSWORD 등)은 .env(루트, .cfignore 로 push 포함)
#   또는 cf set-env 로 넣는다. manifest 에는 비밀값을 두지 않는다.

# 바인딩할 Postgres 서비스 인스턴스 이름은 변수로 받는다(((pg_instance))).
# deploy.sh 가 --var pg_instance=$PG_SERVICE_INSTANCE 로 넘긴다(기본 sr-postgres).
# 이미 만들어둔 인스턴스가 있으면 그 이름을 PG_SERVICE_INSTANCE 로 주면 그걸 바인딩한다.
applications:
  - name: broadcom-sr-web
    # 멀티빌드팩: python(supply)이 먼저 python3 + requirements.txt(python-pptx)를 깔고,
    # nodejs(final)가 앱을 띄운다. 보고서 PPTX 생성(scripts/build_report.py)이 python 을
    # 쓰는데 컨테이너 기본엔 python 이 없어서(ENOENT) 이렇게 공급한다.
    buildpacks:
      - python_buildpack
      - nodejs_buildpack
    command: npm start          # next start (.next 빌드 필요)
    memory: 512M
    instances: 1
    env:
      NODE_ENV: production
      TZ: Asia/Seoul
      SR_APP_URL: https://broadcom-sr-web.apps.nh.ds.lab   # 알림 링크·UI 절대주소
      SR_PYTHON: python3         # 보고서 PPTX 생성기가 쓸 파이썬(공급된 python_buildpack)
      SR_DISABLE_BROWSER_LOGIN: "1"   # 컨테이너는 브라우저 못 돌린다(ENOSPC·SPA Loading 멈춤). /login 은 즉시 안내
    services:
      - ((pg_instance))

  - name: broadcom-sr-mcp
    buildpacks:
      - nodejs_buildpack
    command: node --conditions=react-server mcp/server.ts   # TODO: prod 는 JS 컴파일 권장
    memory: 512M
    instances: 1
    env:
      HOST: 0.0.0.0             # 라우트는 GoRouter 가 TLS 종단
      TZ: Asia/Seoul
      SR_APP_URL: https://broadcom-sr-web.apps.nh.ds.lab
    services:
      - ((pg_instance))

  - name: broadcom-sr-worker
    buildpacks:
      - nodejs_buildpack
    command: node collector/worker.ts   # 주기 수집 루프(collect.ts 를 자식으로 spawn)
    memory: 1G                   # 헤드리스 Chromium(@sparticuz) 재로그인용 — 512M 은 OOM 위험
    disk_quota: 2G               # sparticuz 가 /tmp 에 ~250MB 풀고, 드롭릿 여유 확보
    instances: 1
    no-route: true               # 인바운드 라우트 없음(백그라운드 워커)
    health-check-type: process   # 포트 리슨이 없으므로 프로세스 생존만 확인
    env:
      TZ: Asia/Seoul             # SR_COLLECT_HOURS 판정의 기준 로컬시
      SR_APP_URL: https://broadcom-sr-web.apps.nh.ds.lab   # 수집 알림 링크의 절대주소
      # 컨테이너는 브라우저를 못 돌린다(디스크 2G 가 chromium /tmp 로 차서 ENOSPC → 포털 SPA 가
      # "Loading..." 에 멈춰 로그인 페이지로 못 넘어감). 그래서 재로그인 시 브라우저를 띄우지
      # 않고 fast path(browserless)로만 수집한다. 세션 만료 시 로컬/VM 에서 재시딩한다.
      SR_DISABLE_BROWSER_LOGIN: "1"
    services:
      - ((pg_instance))
