# CI/CD — 배포 대상이 둘로 갈린다.
#   worker : 이 VM(shell 러너)에서 pull + systemctl restart  (브라우저 필요 → VM)
#   web/mcp: TAS 로 cf push                                    (브라우저 불필요 → 컨테이너)
#
# 러너: 그룹 shell 러너(sr-vm). "Run untagged jobs" 를 켜두면 tags 없이 잡을 받는다.
#   태그를 붙였다면 각 잡에 `tags: [<태그>]` 를 추가할 것.

stages:
  - test
  - deploy

# 테스트: 타입체크 + 유닛테스트. 브라우저 안 띄우므로 가볍고 빠르다.
test:
  stage: test
  script:
    - npm ci
    - npm run typecheck
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# worker 배포: main push 시 이 VM 의 수집기를 최신으로 갱신하고 재시작.
# 실제 작업은 레포 밖 고정 스크립트(/usr/local/bin/sr-deploy.sh)가 한다 —
# 레포 안 스크립트를 sudo 로 물리면 push 로 root 를 탈취당할 수 있어서다.
deploy_worker:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - sudo /usr/local/bin/sr-deploy.sh

