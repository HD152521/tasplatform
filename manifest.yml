# TAS 배포 manifest — web / mcp 두 앱.
# worker(수집기)는 아직 앱이 아니다(M2 에서 앱 내부 루프로 추가 예정). 지금은 필요 시
# cf run-task 로 1회 실행한다(deploy.sh 참고).
#
# 데이터: 두 앱이 sr-postgres 서비스를 바인딩한다. 앱은 VCAP_SERVICES 에서 접속정보를
#   읽어(lib/dbConn.ts) Postgres 에 붙고, 첫 起動에 스키마를 자동 생성한다(lib/db.ts).
#   서비스 인스턴스는 deploy.sh 5단계가 없으면 만든다(또는 안내한다).
#
# ⚠ 세션/기기신뢰는 아직 로컬 파일이다(session.json/device.json). Postgres 로 데이터는
#   유지되지만, 재시작 시 로그인 세션은 날아간다(수집기 재로그인 필요). 세션 DB화는 다음 단계.
#
# ⚠ 시크릿(SR_SECRET_KEY/SR_USERNAME/SR_PASSWORD 등)은 .env(루트, .cfignore 로 push 포함)
#   또는 cf set-env 로 넣는다. manifest 에는 비밀값을 두지 않는다.

# 바인딩할 Postgres 서비스 인스턴스 이름은 변수로 받는다(((pg_instance))).
# deploy.sh 가 --var pg_instance=$PG_SERVICE_INSTANCE 로 넘긴다(기본 sr-postgres).
# 이미 만들어둔 인스턴스가 있으면 그 이름을 PG_SERVICE_INSTANCE 로 주면 그걸 바인딩한다.
applications:
  - name: broadcom-sr-web
    buildpacks:
      - nodejs_buildpack
    command: npm start          # next start (.next 빌드 필요)
    memory: 512M
    instances: 1
    env:
      NODE_ENV: production
      TZ: Asia/Seoul
    services:
      - ((pg_instance))

  - name: broadcom-sr-mcp
    buildpacks:
      - nodejs_buildpack
    command: node --conditions=react-server mcp/server.ts   # TODO: prod 는 JS 컴파일 권장
    memory: 512M
    instances: 1
    env:
      HOST: 0.0.0.0             # 라우트는 GoRouter 가 TLS 종단
      TZ: Asia/Seoul
    services:
      - ((pg_instance))
