# CI/CD — 배포 대상이 둘로 갈린다.
#   worker : 이 VM(shell 러너)에서 pull + systemctl restart  (브라우저 필요 → VM)
#   web/mcp: TAS 로 cf push                                    (브라우저 불필요 → 컨테이너)
#
# 러너: 그룹 shell 러너(sr-vm). "Run untagged jobs" 를 켜두면 tags 없이 잡을 받는다.
#   태그를 붙였다면 각 잡에 `tags: [<태그>]` 를 추가할 것.

stages:
  - test
  - deploy

# 테스트: 타입체크 + 유닛테스트. 브라우저 안 띄우므로 가볍고 빠르다.
test:
  stage: test
  script:
    - npm ci
    - npm run typecheck
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# worker 배포: main push 시 이 VM 의 수집기를 최신으로 갱신하고 재시작.
# 실제 작업은 레포 밖 고정 스크립트(/usr/local/bin/sr-deploy.sh)가 한다 —
# 레포 안 스크립트를 sudo 로 물리면 push 로 root 를 탈취당할 수 있어서다.
deploy_worker:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    # 러너가 체크아웃한 소스($CI_PROJECT_DIR)를 앱 디렉터리로 동기화·재시작(git fetch 없음).
    - sudo /usr/local/bin/sr-deploy.sh "$CI_PROJECT_DIR"

# TAS(web/mcp) 자동 배포. main push 시 web·mcp 만 cf push 한다.
#   worker 는 VM 이 담당하므로 여기서 안 건드린다(manifest 의 worker app 은 push 대상에서 제외).
#   cf push 는 cf set-env 로 넣은 기존 환경변수(SR_DATABASE_URL·SR_SECRET_KEY·SR_PG_SCHEMA 등)를
#   보존한다 — manifest 의 env 만 덮어쓴다.
# 준비물:
#   - 러너 VM 에 cf CLI 설치(1회)
#   - CI/CD Variables(Settings > CI/CD > Variables, Masked·Protected):
#       CF_API, CF_USER, CF_PASSWORD, CF_ORG(PA), CF_SPACE(PA)
#       선택 CF_PG_INSTANCE(바인딩할 Postgres 서비스명, 기본 PA-postgres)
deploy_tas:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cf api "$CF_API" --skip-ssl-validation
    - cf auth "$CF_USER" "$CF_PASSWORD"
    - cf target -o "$CF_ORG" -s "$CF_SPACE"
    - cf push broadcom-sr-web -f manifest.yml --var pg_instance="${CF_PG_INSTANCE:-PA-postgres}"
    - cf push broadcom-sr-mcp -f manifest.yml --var pg_instance="${CF_PG_INSTANCE:-PA-postgres}"
